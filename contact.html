    <!-- ヘッダーここまで--------------------------------------------------------------------------------------------------　-->

    <h1 class="hero contact">Contact</h1>

    <!-- メイン　----------------------------------------------------------------------------------------------- -->
    <main>
        <form action="result.html">
            <p>
               <label for="kind" >お問い合わせの種類</label><br>
                <select name="kind" id="kind">
                    <option value="1">ご予約</option>
                    <option value="2">オーダー商品について</option>
                    <option value="1">その他</option>
                </select>
            </p>
            <p>
                はじめてのご来店ですか？<br>
                <input type="radio" name="first" value="yes" checked>はい
                <br>
                <input type="radio" name="first" value="no">いいえ
            </p>
            <p>
                当店をお知りになったきっかけは？<br>
                <input type="checkbox" name="how" value="friend">知り合いの紹介で<br>
                <input type="checkbox" name="how" value="magazine">SNS、WEBサイト、雑誌などを見て
            </p>
            <p>
                お問い合わせの件名<br>
                <input type="text" name="subject" placeholder="タイトル">
            </p>
            <p>
                お問い合わせの具体的な内容<br>
                <textarea name="massage"></textarea>
            </p>
            <p class="submit">
                <input type="submit" value="送信">
            </p>
        </form>
    </main>
